name: Deploy Sitecraft to Cloudflare

# Runs after CI passes on main, or by hand. Builds the image, rolls out the
# Worker and both Containers, then checks the editor, API and MCP server.
# Same setup as pagefold: account ID and API token are repository secrets.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitecraft-cloudflare
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.151.3'
  SITECRAFT_URL: https://sitecraft.guduriphaniram1988.workers.dev

jobs:
  deploy:
    name: Deploy and verify Sitecraft
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITECRAFT_SECRET: ${{ secrets.SITECRAFT_SECRET }}
          SITECRAFT_ADMIN_TOKEN: ${{ secrets.SITECRAFT_ADMIN_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL SITECRAFT_SECRET SITECRAFT_ADMIN_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Add the $key repository secret in Settings > Secrets and variables > Actions. See docs/CLOUDFLARE.md."
              missing=1
            fi
          done
          if [ ${#SITECRAFT_SECRET} -lt 32 ]; then
            echo "::error::SITECRAFT_SECRET must be at least 32 characters (openssl rand -hex 32)."
            missing=1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            "") ;;
            *) echo "::error::DATABASE_URL must be a postgres:// URL, not the psql 'host=… port=…' form. See docs/CLOUDFLARE.md step 4."; missing=1 ;;
          esac
          if echo "$DATABASE_URL" | grep -Eq ':6432/|-pooler\.|pgbouncer'; then
            echo "::error::DATABASE_URL points at a connection pooler. Use the direct connection (port 5432) so Claude's edits reach open editors. See docs/CLOUDFLARE.md step 4."
            missing=1
          fi
          exit $missing

      - name: Install and test
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec vitest run packages deploy

      - name: Make sure the R2 bucket exists
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          command: r2 bucket create sitecraft

      - name: Deploy Worker, Containers and secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          command: deploy
          secrets: |
            CLOUDFLARE_ACCOUNT_ID
            DATABASE_URL
            SECRET
            ADMIN_TOKEN
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET: ${{ secrets.SITECRAFT_SECRET }}
          ADMIN_TOKEN: ${{ secrets.SITECRAFT_ADMIN_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Verify editor, API and MCP server
        id: verify
        env:
          ADMIN_TOKEN: ${{ secrets.SITECRAFT_ADMIN_TOKEN }}
        run: |
          # A first rollout can take a few minutes while Cloudflare pulls the image.
          for i in $(seq 1 40); do
            if curl -fsS "$SITECRAFT_URL/healthz" >/dev/null; then break; fi
            [ "$i" = 40 ] && { echo "::error::$SITECRAFT_URL/healthz didn't answer within 10 minutes. Check 'npx wrangler containers list' and the Worker logs."; exit 1; }
            sleep 15
          done
          echo "App is up."
          curl -fsS -H "accept: text/html" "$SITECRAFT_URL/" | grep -q "<title>Sitecraft</title>" || { echo "::error::The editor page didn't load."; exit 1; }
          curl -fsS -H "authorization: Bearer $ADMIN_TOKEN" "$SITECRAFT_URL/api/me" | grep -q '"role":"admin"' || { echo "::error::The API rejected SITECRAFT_ADMIN_TOKEN."; exit 1; }
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/mcp.json -w "%{http_code}" -X POST "$SITECRAFT_URL/mcp" \
              -H "authorization: Bearer $ADMIN_TOKEN" -H "content-type: application/json" -H "accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
            if [ "$code" = 200 ] && grep -q '"edit_site"' /tmp/mcp.json; then echo "MCP server is up."; exit 0; fi
            sleep 15
          done
          echo "::error::The MCP server at $SITECRAFT_URL/mcp didn't list its tools (last status $code)."
          exit 1

      - name: Publish deployment status
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          {
            echo "### Sitecraft"
            echo
            echo "- Editor: $SITECRAFT_URL"
            echo "- Claude Code MCP: $SITECRAFT_URL/mcp"
            echo "- Published sites: $SITECRAFT_URL/s/<slug>"
            echo
            echo "Runtime checks: $VERIFY."
          } >> "$GITHUB_STEP_SUMMARY"
