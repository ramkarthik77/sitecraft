name: Release images

# Builds the app and MCP images and pushes them to GitHub Container Registry:
#   ghcr.io/<owner>/sitecraft:<sha> and :latest
#   ghcr.io/<owner>/sitecraft-mcp:<sha> and :latest
# A deploy job can then roll these out to your host (see docs/DEPLOY.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/sitecraft:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/sitecraft:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: mcp
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/sitecraft-mcp:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.owner }}/sitecraft-mcp:latest
          cache-from: type=gha
