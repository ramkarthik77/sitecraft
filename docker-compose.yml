# Local end-to-end stack: docker compose up --build
#   Editor + API + hosted sites  http://localhost:4000
#   MCP server for Claude Code   http://localhost:4100/mcp
#   Assets                      persisted local Docker volume (no external S3)
name: sitecraft

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sitecraft
      POSTGRES_PASSWORD: sitecraft
      POSTGRES_DB: sitecraft
    ports: ["127.0.0.1:5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitecraft -d sitecraft"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot local volume setup. The server runs as a non-root "sitecraft"
  # user, so a freshly created Docker volume needs matching ownership.
  # Reuse the same app image so the UID/GID always match the server process.
  media-init:
    build: { context: ., target: app }
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /app/data/storage && chown -R sitecraft:sitecraft /app/data/storage"]
    volumes: [media:/app/data/storage]
    restart: "no"

  app:
    build: { context: ., target: app }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://sitecraft:sitecraft@db:5432/sitecraft
      STORAGE_DRIVER: fs
      STORAGE_DIR: /app/data/storage
      PUBLIC_URL: http://localhost:4000
      EDITOR_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:4000,http://localhost:5173
    ports: ["127.0.0.1:4000:4000"]
    volumes: [media:/app/data/storage]
    depends_on:
      db: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }

  mcp:
    build: { context: ., target: mcp }
    environment:
      SITECRAFT_API_URL: http://app:4000
    ports: ["127.0.0.1:4100:4100"]
    depends_on:
      app: { condition: service_healthy }

volumes:
  db:
  media:
